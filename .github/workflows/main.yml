name: Build APK

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'ZIP download URL'
        required: true
      build_type:
        description: 'debug or release'
        default: 'debug'
      callback_url:
        description: 'Callback URL when done'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.download_url }}" -o project.zip
          unzip project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 4 | head -1 | xargs dirname)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, using system gradle"
            gradle wrapper
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

          BUILD_TASK="assembleDebug"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            BUILD_TASK="assembleRelease"
          fi
          ./gradlew $BUILD_TASK --no-daemon --warning-mode=none -Dorg.gradle.configureondemand=false

      - name: Find and upload APK
        run: |
          APK=$(find . -name "*.apk" | grep -v unsigned | head -1)
          echo "Found APK: $APK"
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -F "apk=@$APK" \
            -F "status=success"
