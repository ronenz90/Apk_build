name: Create Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore Password'
        required: true
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'my-key'
      key_password:
        description: 'Key Password'
        required: true
      first_last_name:
        description: 'First and Last Name'
        required: true
      organization:
        description: 'Organization'
        required: true
        default: 'dev'
      country:
        description: 'Country Code'
        required: true
        default: 'IL'

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ github.event.inputs.key_alias }}" \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.first_last_name }}, OU=${{ github.event.inputs.organization }}, O=${{ github.event.inputs.organization }}, L=TelAviv, S=IL, C=${{ github.event.inputs.country }}"

          echo "=== Keystore created successfully ==="
          keytool -list -keystore release.jks -storepass "${{ github.event.inputs.keystore_password }}"

          # Convert to base64 for use as GitHub Secret
          base64 release.jks > release.jks.b64
          echo ""
          echo "=== BASE64 (copy this as KEYSTORE_BASE64 secret) ==="
          cat release.jks.b64

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.jks
            release.jks.b64
          retention-days: 1
