name: Build APK

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'ZIP download URL'
        required: true
      build_type:
        description: 'debug, release, or aab'
        default: 'debug'
      callback_url:
        description: 'Callback URL when done'
        required: true
      project_name:
        description: 'Original ZIP filename (without .zip)'
        required: false
        default: 'app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.download_url }}" -o project.zip
          unzip project.zip -d project
          echo "=== ZIP contents ==="
          find project -maxdepth 3 -type f | head -30

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-34
            platforms;android-33
            platforms;android-32
            build-tools;34.0.0
            build-tools;33.0.2

      - name: Find project root
        id: find_root
        run: |
          SETTINGS=$(find project -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Setup local.properties
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Setup gradlew
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version=8.4
          fi
          chmod +x gradlew

      - name: Build
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ "$BUILD_TYPE" = "aab" ]; then
            BUILD_TASK="bundleRelease"
          elif [ "$BUILD_TYPE" = "release" ]; then
            BUILD_TASK="assembleRelease"
          else
            BUILD_TASK="assembleDebug"
          fi

          echo "Running: ./gradlew $BUILD_TASK"
          ./gradlew $BUILD_TASK \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            2>&1

      - name: Find output file
        id: find_output
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ "$BUILD_TYPE" = "aab" ]; then
            OUTPUT=$(find "$PROJECT_DIR" -name "*.aab" | head -1)
          else
            OUTPUT=$(find "$PROJECT_DIR" -name "*.apk" | head -1)
          fi

          if [ -z "$OUTPUT" ]; then
            echo "ERROR: No output file found!"
            exit 1
          fi
          echo "output_path=$OUTPUT" >> $GITHUB_OUTPUT
          echo "Found: $OUTPUT"

      - name: Sign output (Release and AAB)
        id: sign_output
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'aab'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          OUTPUT="${{ steps.find_output.outputs.output_path }}"

          if [ "$BUILD_TYPE" = "aab" ]; then
            # Sign AAB with jarsigner
            SIGNED="/tmp/signed.aab"
            jarsigner \
              -keystore /tmp/release.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              -signedjar "$SIGNED" \
              "$OUTPUT" \
              "${{ secrets.KEY_ALIAS }}"
            echo "AAB signed successfully"
          else
            # Sign APK with apksigner
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -r | head -1)
            SIGNED="/tmp/signed.apk"
            $APKSIGNER sign \
              --ks /tmp/release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$SIGNED" \
              "$OUTPUT"
            $APKSIGNER verify "$SIGNED"
            echo "APK signed and verified"
          fi

          echo "signed_path=$SIGNED" >> $GITHUB_OUTPUT

      - name: Prepare final file
        id: prepare
        run: |
          PROJECT_NAME="${{ github.event.inputs.project_name }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ "$BUILD_TYPE" = "aab" ]; then
            EXT="aab"
            FINAL_PATH="${{ steps.sign_output.outputs.signed_path }}"
          elif [ "$BUILD_TYPE" = "release" ]; then
            EXT="apk"
            FINAL_PATH="${{ steps.sign_output.outputs.signed_path }}"
          else
            EXT="apk"
            FINAL_PATH="${{ steps.find_output.outputs.output_path }}"
          fi

          NEW_NAME="${PROJECT_NAME}-${BUILD_TYPE}.${EXT}"
          NEW_PATH="/tmp/${NEW_NAME}"
          cp "$FINAL_PATH" "$NEW_PATH"
          echo "final_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Final file: $NEW_NAME ($(du -sh $NEW_PATH | cut -f1))"

      - name: Upload to callback
        run: |
          FINAL="${{ steps.prepare.outputs.final_path }}"
          CALLBACK="${{ github.event.inputs.callback_url }}"
          HTTP_CODE=$(curl -s -o /tmp/callback_response.txt -w "%{http_code}" \
            -X POST "$CALLBACK" \
            -F "apk=@$FINAL" \
            -F "status=success")
          echo "Response code: $HTTP_CODE"
          cat /tmp/callback_response.txt

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -F "status=error" \
            -F "error=Build failed - check GitHub Actions logs"
