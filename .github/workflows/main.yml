name: Build APK

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'ZIP download URL'
        required: true
      build_type:
        description: 'debug or release'
        default: 'debug'
      callback_url:
        description: 'Callback URL when done'
        required: true
      project_name:
        description: 'Original ZIP filename (without .zip)'
        required: false
        default: 'app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.download_url }}" -o project.zip
          unzip project.zip -d project
          echo "=== ZIP contents ==="
          find project -maxdepth 3 -type f | head -30

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-34
            platforms;android-33
            platforms;android-32
            build-tools;34.0.0
            build-tools;33.0.2

      - name: Find project root
        id: find_root
        run: |
          SETTINGS=$(find project -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Setup local.properties
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Setup gradlew
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version=8.4
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          BUILD_TASK="assembleDebug"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            BUILD_TASK="assembleRelease"
          fi

          echo "Running: ./gradlew $BUILD_TASK"
          ./gradlew $BUILD_TASK \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            2>&1

      - name: Find APK
        id: find_apk
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          # Get any APK (signed or unsigned)
          APK=$(find "$PROJECT_DIR" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Sign APK (Release only)
        id: sign_apk
        if: github.event.inputs.build_type == 'release'
        run: |
          # Decode keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

          # Find apksigner
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -r | head -1)
          echo "Using apksigner: $APKSIGNER"

          APK="${{ steps.find_apk.outputs.apk_path }}"
          SIGNED_APK="/tmp/signed.apk"

          # Sign the APK
          $APKSIGNER sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$APK"

          # Verify
          $APKSIGNER verify "$SIGNED_APK"
          echo "APK signed and verified successfully!"
          echo "signed_apk=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Rename and prepare APK
        id: prepare_apk
        run: |
          PROJECT_NAME="${{ github.event.inputs.project_name }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          NEW_NAME="${PROJECT_NAME}-${BUILD_TYPE}.apk"
          NEW_PATH="/tmp/${NEW_NAME}"

          if [ "$BUILD_TYPE" = "release" ]; then
            cp "${{ steps.sign_apk.outputs.signed_apk }}" "$NEW_PATH"
          else
            cp "${{ steps.find_apk.outputs.apk_path }}" "$NEW_PATH"
          fi

          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Final APK: $NEW_NAME ($(du -sh $NEW_PATH | cut -f1))"

      - name: Upload APK to callback
        run: |
          APK="${{ steps.prepare_apk.outputs.apk_path }}"
          CALLBACK="${{ github.event.inputs.callback_url }}"
          HTTP_CODE=$(curl -s -o /tmp/callback_response.txt -w "%{http_code}" \
            -X POST "$CALLBACK" \
            -F "apk=@$APK" \
            -F "status=success")
          echo "Response code: $HTTP_CODE"
          cat /tmp/callback_response.txt

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -F "status=error" \
            -F "error=Build failed - check GitHub Actions logs"
