name: Build APK

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'ZIP download URL'
        required: true
      build_type:
        description: 'debug or release'
        default: 'debug'
      callback_url:
        description: 'Callback URL when done'
        required: true
      project_name:
        description: 'Original ZIP filename (without .zip)'
        required: false
        default: 'app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.download_url }}" -o project.zip
          unzip project.zip -d project
          echo "=== ZIP contents (top level) ==="
          find project -maxdepth 3 -type f | head -30

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-34
            platforms;android-33
            platforms;android-32
            build-tools;34.0.0
            build-tools;33.0.2

      - name: Find project root
        id: find_root
        run: |
          SETTINGS=$(find project -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found!"
            find project -type f | head -50
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Setup local.properties
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          echo "Written local.properties with sdk.dir=$ANDROID_SDK_ROOT"

      - name: Setup gradlew
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating with gradle wrapper..."
            gradle wrapper --gradle-version=8.4
          fi
          chmod +x gradlew
          echo "gradlew ready"

      - name: Build APK
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          BUILD_TASK="assembleDebug"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            BUILD_TASK="assembleRelease"
          fi

          echo "Running: ./gradlew $BUILD_TASK"
          ./gradlew $BUILD_TASK \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            2>&1

      - name: Find APK and rename
        id: find_apk
        run: |
          PROJECT_DIR="${{ steps.find_root.outputs.project_dir }}"

          # Try to find signed APK first, then fall back to unsigned
          APK=$(find "$PROJECT_DIR" -name "*.apk" | grep -v "unsigned" | head -1)
          if [ -z "$APK" ]; then
            echo "No signed APK found, trying unsigned..."
            APK=$(find "$PROJECT_DIR" -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found after build!"
            find "$PROJECT_DIR/app/build" -type f 2>/dev/null | head -20
            exit 1
          fi

          PROJECT_NAME="${{ github.event.inputs.project_name }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          NEW_NAME="${PROJECT_NAME}-${BUILD_TYPE}.apk"
          NEW_PATH="/tmp/${NEW_NAME}"
          cp "$APK" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Renamed APK to: $NEW_NAME ($(du -sh $NEW_PATH | cut -f1))"

      - name: Upload APK to callback
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          CALLBACK="${{ github.event.inputs.callback_url }}"
          echo "Uploading APK to: $CALLBACK"
          HTTP_CODE=$(curl -s -o /tmp/callback_response.txt -w "%{http_code}" \
            -X POST "$CALLBACK" \
            -F "apk=@$APK" \
            -F "status=success")
          echo "Response code: $HTTP_CODE"
          cat /tmp/callback_response.txt

      - name: Notify failure
        if: failure()
        run: |
          CALLBACK="${{ github.event.inputs.callback_url }}"
          curl -s -X POST "$CALLBACK" \
            -F "status=error" \
            -F "error=Build failed - check GitHub Actions logs"
